<!doctype html>
<html lang="zh-CN" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Illusion Realm · 登录布局预览</title>
<style>/* TAILWIND */</style>
<style>
:root{color-scheme:light;--paper:#ffffff;--ink:#202329;--muted:#737781;--line:#e9ebef;--subtle:#f3f4f6;--sky:#00a8ef;--card:rgba(255,255,255,.97)}
:root[data-theme=dark]{color-scheme:dark;--paper:#181c24;--ink:#e9ecf3;--muted:#a0a9b9;--line:#303845;--subtle:#242b36;--sky:#38bdf8;--card:rgba(24,28,36,.97)}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:3px}button{transition:background .15s,color .15s}button:disabled{cursor:default;opacity:.6}
.login-shell{position:relative;isolation:isolate;display:grid;width:100%;height:100dvh;overflow:hidden;background:#bdd6e4;color:var(--ink)}
.login-art{position:absolute;inset:0;background-image:url('/* BACKGROUND */');background-size:cover;background-position:center 42%;z-index:-2}
.login-art:after{content:"";position:absolute;inset:0;background:rgba(15,23,42,.22)}[data-theme=dark] .login-art:after{background:rgba(15,23,42,.42)}
.auth-pane{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{display:flex;flex-direction:column;width:420px;max-width:100%;max-height:100%;min-height:0;border:1px solid #ffffff38;border-radius:24px;background:var(--card);box-shadow:0 16px 64px #0f172a29;overflow:hidden;backdrop-filter:blur(12px)}
.auth-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:28px 32px 20px}
.auth-group{width:100%;max-width:360px;margin-inline:auto;flex-shrink:0}
.brand{margin-bottom:28px;text-align:center}.brand h1{font-size:34px;line-height:1.2;font-weight:750;letter-spacing:-1.2px;color:var(--sky);overflow-wrap:anywhere}.brand p{margin-top:7px;font-size:12px;line-height:1.5;color:var(--sky)}
.card-footer{flex-shrink:0;padding:0 32px 20px;text-align:center}.card-footer p:first-child{padding-top:12px;border-top:1px solid var(--line)}
.theme-toggle{position:absolute;top:16px;right:16px;z-index:2;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--paper)}.theme-toggle:hover{background:var(--subtle)}
.primary{height:44px;width:100%;border-radius:999px;background:var(--sky);font-size:14px;font-weight:600;color:#fff}.primary:hover{background:#0096d6}.secondary{height:44px;width:100%;border-radius:999px;background:var(--subtle);font-size:14px;font-weight:600}.secondary:hover{background:var(--line)}
.provider{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--subtle)}.provider:hover{background:var(--line)}.provider svg{width:20px;height:20px}
.input{display:block;width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--subtle);color:var(--ink);font-size:14px;outline:none}.input:focus{border-color:var(--sky);box-shadow:0 0 0 3px #0ea5e91a}.input::placeholder{color:var(--muted)}
.login-shell[data-layout=split]{grid-template-columns:minmax(0,1fr) clamp(420px,28vw,480px)}
[data-layout=split] .login-art{position:relative;inset:auto;grid-column:1;grid-row:1;margin-right:-24px;min-width:0;min-height:0}
[data-layout=split] .auth-pane{grid-column:2;grid-row:1;padding:0}
[data-layout=split] .auth-card{width:100%;height:100%;max-height:none;border:0;border-radius:24px 0 0 24px;box-shadow:-12px 0 48px #0f172a0a}
[data-layout=split] .auth-scroll{flex:1;display:flex;padding:48px 36px 28px}
[data-layout=split] .auth-group{margin-block:auto}
[data-layout=split] .card-footer{padding:0 36px 24px}
@media(max-height:720px){.auth-pane{padding-block:16px}.auth-scroll{padding-top:24px;padding-bottom:16px}.brand{margin-bottom:20px}.brand h1{font-size:30px}.card-footer{padding-bottom:16px}.card-footer p:first-child{padding-top:10px}[data-layout=split] .auth-scroll{padding-top:48px;padding-bottom:20px}[data-layout=split] .card-footer{padding-bottom:16px}}
@media(max-width:480px){.auth-pane{padding:16px}.auth-scroll{padding:28px 24px 20px}.card-footer{padding:0 24px 20px}.brand h1{font-size:30px}.theme-toggle{top:8px;right:8px;width:32px;height:32px}.auth-card{border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<main id="login-shell" class="login-shell" data-layout="centered">
  <!-- 界面：项目原有登录背景；不添加新的角色或装饰 -->
  <div class="login-art" role="presentation"></div>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换深色主题" title="切换主题"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-4 fill-none stroke-current stroke-[1.5]"><path d="M20 14a8 8 0 0 1-10-10A8 8 0 1 0 20 14Z"/></svg></button>
  <div class="auth-pane">
    <section class="auth-card" aria-label="账号登录与游客入口">
      <!-- 界面：品牌与操作整体排列，高度不足时一起滚动 -->
      <div id="auth-scroll" class="auth-scroll">
        <div class="auth-group">
          <header class="brand"><h1>Illusion Realm</h1><p>幻域 · 灵感在这里成真</p></header>
          <p id="expired" role="status" class="mb-5 rounded-xl bg-amber-500/10 px-3 py-3 text-center text-xs leading-5 text-amber-700">游客会话已到期，请重新选择进入方式。</p>
          <div id="landing">
            <h2 class="mb-5 text-center text-sm font-semibold">开启你的创作世界</h2>
            <div class="space-y-3"><button type="button" class="primary" data-mode="register">创建账号</button><button type="button" class="secondary" data-mode="login">登录</button></div>
          </div>
          <div id="account" hidden>
            <div class="mb-5 flex items-center gap-2"><button type="button" id="back" aria-label="返回" class="-ml-2 grid size-9 place-items-center rounded-full hover:bg-[var(--subtle)]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-[1.5]"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><h2 id="form-title" class="text-sm font-semibold">登录 Illusion Realm</h2></div>
            <form id="account-form" class="space-y-4">
              <label class="block text-xs font-medium"><span class="mb-2 block">邮箱</span><input class="input" name="email" required type="email" placeholder="请输入邮箱地址" autocomplete="email"></label>
              <label id="name-field" hidden class="block text-xs font-medium"><span class="mb-2 block">昵称</span><input class="input" name="displayName" maxlength="100" placeholder="请输入昵称" autocomplete="nickname"></label>
              <label class="block text-xs font-medium"><span class="mb-2 block">密码</span><span class="relative block"><input class="input pr-14" id="password" name="password" required type="password" placeholder="请输入密码" autocomplete="current-password"><button type="button" data-password="password" class="absolute inset-y-0 right-2 px-2 text-xs text-[var(--muted)]" aria-label="显示密码">显示</button></span><span id="password-hint" hidden class="mt-2 block text-[11px] font-normal text-[var(--muted)]">至少 12 个字符</span></label>
              <label id="confirm-field" hidden class="block text-xs font-medium"><span class="mb-2 block">确认密码</span><span class="relative block"><input class="input pr-14" id="confirm-password" name="confirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password"><button type="button" data-password="confirm-password" class="absolute inset-y-0 right-2 px-2 text-xs text-[var(--muted)]" aria-label="显示确认密码">显示</button></span></label>
              <button id="forgot" type="button" class="text-xs text-[var(--sky)] hover:underline">忘记密码？</button>
              <p id="recovery" hidden class="rounded-lg bg-[var(--subtle)] p-3 text-xs leading-5 text-[var(--muted)]">暂未开放密码找回，当前无法通过邮件重置密码。若仍记得密码，请直接登录。</p>
              <button type="submit" id="submit" class="primary">登录</button>
              <p id="form-status" role="status" class="text-xs leading-5 text-[var(--muted)]">布局预览：提交仅作本地校验，不发送账号信息。</p>
              <p class="text-center text-xs text-[var(--muted)]"><span id="mode-prompt">还没有账号？</span> <button type="button" id="switch-mode" class="text-[var(--sky)] hover:underline">创建账号</button></p>
            </form>
          </div>
          <div class="mt-6 text-center"><p class="text-xs text-[var(--muted)]">使用其他账号继续</p><div class="mt-3 flex justify-center gap-3"><button type="button" class="provider" data-provider="Google" aria-label="使用 Google 登录">{{GOOGLE}}</button><button type="button" class="provider" data-provider="Apple" aria-label="使用 Apple 登录">{{APPLE}}</button><button type="button" class="provider" data-provider="GitHub" aria-label="使用 GitHub 登录">{{GITHUB}}</button></div></div>
          <div class="mt-5 border-t border-[var(--line)] pt-4 text-center"><button type="button" id="guest" class="inline-flex min-h-10 items-center gap-2 rounded-full px-4 text-sm font-medium text-[var(--sky)] hover:bg-sky-500/10"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-4 fill-none stroke-current stroke-[1.5]"><path d="M14 4h5v16h-5M3 12h12m-5-5 5 5-5 5"/></svg>以游客身份进入</button><p class="mt-1 text-xs leading-5 text-[var(--muted)]">无需账号，访客会话有效期为 1 小时</p><p id="guest-status" role="status" hidden class="mt-2 text-xs leading-5 text-[var(--sky)]">当前为布局预览，未创建游客会话。</p></div>
        </div>
      </div>
      <footer class="card-footer"><p class="text-[11px] leading-5 text-[var(--muted)]">密码仅通过 HTTPS 提交到账户服务，令牌由桌面端安全保存。</p><p class="mt-2 text-xs leading-5 text-[var(--muted)]">为每一次灵感，留一个开始。</p></footer>
    </section>
  </div>
</main>
<div id="notice" hidden role="status" class="fixed bottom-6 left-1/2 z-30 max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-xs leading-5 text-white shadow-lg"></div>
<script>/* INTERACTIONS */</script>
</body></html>
