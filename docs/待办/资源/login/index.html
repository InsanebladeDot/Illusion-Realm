<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录页 · 响应式布局预览</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#30343b;background:#e6e8ed}body{display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0;z-index:2}strong{font-size:13px}.hint{font-size:11px;color:#6c727f}select,button{font:inherit;color:inherit;background:#f6f7f9;border:1px solid #e4e6eb;border-radius:7px;padding:6px 8px;cursor:pointer}a{color:#0284c7;text-decoration:none}button:hover{background:#e9eef5}select:focus-visible,button:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px}.check{display:flex;align-items:center;gap:5px}input{accent-color:#0ea5e9}.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}iframe{border:0;position:absolute;transform-origin:top left;background:#bdd6e4;box-shadow:0 6px 28px #1e293b26}.toolbar label{display:flex;align-items:center;gap:6px}.meta{background:#fff;padding:5px 16px;font-size:11px;color:#6c727f;flex-shrink:0;display:flex;justify-content:space-between;gap:12px}@media(max-width:650px){.toolbar{padding:8px;gap:6px 10px}.hint{display:none}strong{width:100%}.meta{padding:5px 8px}}
</style></head><body>
<header class="toolbar"><strong>登录页 · 尺寸优化预览</strong><label>视口<select id="size"><option value="auto">跟随浏览器</option><option value="1440,900">普通桌面 1440 × 900</option><option value="1920,1080">宽屏 1920 × 1080</option><option value="1280,540">矮窗口 1280 × 540</option><option value="390,844">手机 390 × 844</option><option value="320,500">小屏 320 × 500</option></select></label><label>布局<select id="layout"><option value="auto">自动判断</option><option value="centered">居中卡片</option><option value="split">右侧分栏</option></select></label><label class="check"><input id="expired" type="checkbox" checked>会话过期提示</label><button id="landing">首页</button><button id="login">登录</button><button id="register">注册</button><a href="login.html" target="_blank" rel="noopener">独立打开 ↗</a></header>
<div class="stage" id="stage"><iframe id="preview" title="Illusion Realm 登录布局" src="login.html"></iframe></div>
<footer class="meta"><span id="metrics"></span><span>使用项目原素材 · 仅本地交互演示，不发送账号信息</span></footer>
<script>
const byId=id=>document.getElementById(id);const frame=byId('preview');
function signal(mode){frame.contentWindow.postMessage({source:'ir-login-preview',layout:byId('layout').value,expired:byId('expired').checked,...(mode?{mode}:{})},location.protocol==='file:'?'*':location.origin)}
function resize(){const area=byId('stage'),preset=byId('size').value;const[w,h]=preset==='auto'?[area.clientWidth,area.clientHeight]:preset.split(',').map(Number);const scale=preset==='auto'?1:Math.min((area.clientWidth-24)/w,(area.clientHeight-24)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',left:Math.max(0,(area.clientWidth-w*scale)/2)+'px',top:Math.max(0,(area.clientHeight-h*scale)/2)+'px',transform:'scale('+scale+')'});byId('metrics').textContent=w+' × '+h+' CSS px · 预览缩放 '+Math.round(scale*100)+'%';signal()}
byId('size').onchange=resize;byId('layout').onchange=()=>signal();byId('expired').onchange=()=>signal();
for(const mode of ['landing','login','register'])byId(mode).onclick=()=>signal(mode);
frame.onload=resize;addEventListener('resize',resize);new ResizeObserver(resize).observe(byId('stage'));
</script></body></html>
