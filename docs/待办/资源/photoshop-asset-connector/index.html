<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photoshop 图像工具</title>
  <!--
    这是 Photoshop UXP 工具面板的浏览器样例，只保留 ps.js 已有的文档操作。
    浏览器不能调用 require('photoshop')、executeAsModal 或 batchPlay，因此按钮只演示状态。
    将这些事件处理器接入 UXP 时，页面中的 data-action 与 ps.js 导出方法一一对应。
    页面不包含资产管理、AI 生成平台、Agent 对话、服务连接或项目设置。
  -->
  <style>
    /* 颜色沿用 Photoshop 深色工作区，让面板停靠后不形成突兀的亮色块。 */
    /* 蓝色只表示当前选择和主要动作，绿色只用于成功状态。 */
    :root {
      color-scheme: dark;
      --bg: #1d1d1d;
      --panel: #252525;
      --raised: #303030;
      --hover: #383838;
      --line: #424242;
      --line-soft: #343434;
      --text: #f1f1f1;
      --muted: #a9a9a9;
      --faint: #777;
      --blue: #2680eb;
      --blue-hover: #1473e6;
      --green: #39b977;
      --warning: #e6a23c;
      --danger: #ef6b6b;
      --radius: 5px;
    }
    /* border-box 保证 280px 窄面板中，输入框不会被内边距撑出视口。 */
    * { box-sizing: border-box; }
    /* body 不滚动，滚动责任交给工具内容区，避免出现两条滚动条。 */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #7eb8ff; outline-offset: 1px; }
    /* app 填满 PS 停靠面板，最小高度仍保留顶部状态和底部反馈。 */
    .app { height: 100%; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
    /* 顶栏只显示插件身份和 Photoshop 文档状态，不再承担业务导航。 */
    .app-head { flex: 0 0 42px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line-soft); background: #202020; }
    .brand { min-width: 0; display: flex; align-items: center; gap: 8px; }
    /* PS 字标用于快速识别工具归属，不加载外部图标和字体。 */
    .ps-mark { width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid #2f9bff; border-radius: 4px; background: #001e36; color: #31a8ff; font-size: 11px; font-weight: 800; }
    .brand-copy { min-width: 0; }
    .brand-title { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .brand-sub { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    /* 文档状态同时使用圆点和文字，避免只靠颜色传达状态。 */
    .doc-state { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--panel); font-size: 10px; }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    /* 工具内容是面板唯一纵向滚动区。 */
    .tool-scroll { min-height: 0; flex: 1 1 auto; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    /* 文档摘要置于首屏最上方，操作前先让用户确认作用目标。 */
    .document-summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 9px; margin-bottom: 8px; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--panel); }
    .document-name { overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .document-meta { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .layer-pill { max-width: 130px; overflow: hidden; color: #d5d5d5; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    /* section 是功能分组，不做浮动卡片；边界用于区分不同 PS 操作范围。 */
    .section { margin-bottom: 8px; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--panel); }
    .section-head { display: flex; align-items: center; justify-content: space-between; min-height: 31px; padding: 6px 8px; border-bottom: 1px solid var(--line-soft); }
    .section-title { font-weight: 700; }
    .section-hint { color: var(--faint); font-size: 9.5px; }
    .section-body { padding: 8px; }
    /* 控件高度保持在 28px 左右，适合 Photoshop 工具面板的信息密度。 */
    .button, .icon-button, .seg, .direction { min-height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--raised); color: #dedede; cursor: pointer; transition: background .12s, border-color .12s; }
    .button { padding: 0 10px; }
    .button:hover, .icon-button:hover, .seg:hover, .direction:hover { border-color: #5b5b5b; background: var(--hover); }
    .button.primary { border-color: var(--blue); background: var(--blue); color: white; }
    .button.primary:hover { border-color: var(--blue-hover); background: var(--blue-hover); }
    .button.wide { width: 100%; }
    .button:disabled { opacity: .4; cursor: default; }
    /* segmented control 只切换导出范围，不创建第二套导出逻辑。 */
    .segments { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 5px; background: #1c1c1c; }
    .seg { min-width: 0; border-color: transparent; }
    .seg.active { border-color: #686868; background: #4a4a4a; color: white; }
    .action-row { display: flex; gap: 6px; margin-top: 7px; }
    .action-row > * { min-width: 0; flex: 1 1 0; }
    /* 隐藏的文件输入由可见按钮触发，文件名显示在相邻文本区。 */
    .file-input { display: none; }
    .file-result { min-height: 17px; margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    /* 选区数据使用四列对齐，便于高频核对数值。 */
    .bounds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 7px; }
    .bound { min-width: 0; padding: 5px 4px; border: 1px solid var(--line-soft); border-radius: 4px; background: #202020; text-align: center; }
    .bound span { display: block; color: var(--faint); font-size: 9px; }
    .bound strong { display: block; margin-top: 1px; overflow: hidden; font-size: 10px; text-overflow: ellipsis; }
    /* 扩图方向围绕中心画布排列，使空间关系一眼可见。 */
    .outpaint-layout { display: grid; grid-template-columns: 42px minmax(100px, 1fr) 42px; grid-template-rows: 32px 88px 32px; gap: 4px; align-items: stretch; }
    .direction { display: grid; place-items: center; padding: 0; color: var(--muted); }
    .direction.active { border-color: #68aefc; background: rgba(38, 128, 235, .25); color: white; }
    .direction.top { grid-column: 2; grid-row: 1; }
    .direction.left { grid-column: 1; grid-row: 2; }
    .direction.right { grid-column: 3; grid-row: 2; }
    .direction.bottom { grid-column: 2; grid-row: 3; }
    /* 画布示意只表达边缘与透明扩展区，不伪装成真实 Photoshop 预览。 */
    .canvas-preview { position: relative; grid-column: 2; grid-row: 2; overflow: hidden; border: 1px solid #5a5a5a; background-color: #2b2b2b; background-image: linear-gradient(45deg, #353535 25%, transparent 25%), linear-gradient(-45deg, #353535 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #353535 75%), linear-gradient(-45deg, transparent 75%, #353535 75%); background-position: 0 0, 0 6px, 6px -6px, -6px 0; background-size: 12px 12px; }
    .canvas-image { position: absolute; inset: 10px 15px; display: grid; place-items: center; border: 1px solid #6b6b6b; background: linear-gradient(135deg, #49515b, #2f3540); color: #d7dbe0; font-size: 10px; }
    .expand-mark { position: absolute; display: none; background: rgba(38, 128, 235, .32); }
    .expand-mark.active { display: block; }
    .expand-mark.top { inset: 0 15px auto; height: 10px; }
    .expand-mark.bottom { inset: auto 15px 0; height: 10px; }
    .expand-mark.left { inset: 10px auto 10px 0; width: 15px; }
    .expand-mark.right { inset: 10px 0 10px auto; width: 15px; }
    .pixels-row { display: grid; grid-template-columns: auto minmax(70px, 1fr) 72px; gap: 7px; align-items: center; margin-top: 8px; }
    .pixels-row label { color: var(--muted); }
    input[type="range"] { min-width: 0; accent-color: var(--blue); }
    input[type="number"] { width: 72px; height: 27px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; background: #1c1c1c; color: var(--text); }
    /* 底部反馈固定可见，长错误会截断并通过 title 保留全文。 */
    .status-bar { flex: 0 0 31px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border-top: 1px solid var(--line-soft); background: #202020; color: var(--muted); font-size: 10px; }
    .status-icon { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--faint); }
    .status-icon.busy { background: var(--warning); }
    .status-icon.ok { background: var(--green); }
    .status-icon.error { background: var(--danger); }
    .status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 低于 330px 后，操作按钮换行，正文仍保持可读字号。 */
    @media (max-width: 330px) { .action-row { flex-direction: column; } .action-row > * { flex-basis: 28px; } .document-summary { grid-template-columns: minmax(0, 1fr); gap: 4px; } .layer-pill { max-width: none; } }
    /* 用户关闭动态效果后，按钮和状态仍保持完整，只去掉过渡。 */
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <!-- 应用外壳：没有资产、生成、Agent 或设置导航。 -->
  <main class="app">
    <!-- 顶部：只显示 Photoshop 工具身份和当前文档是否可用。 -->
    <header class="app-head">
      <div class="brand"><div class="ps-mark" aria-hidden="true">Ps</div><div class="brand-copy"><div class="brand-title">Photoshop 图像工具</div><div class="brand-sub">文档 · 图层 · 选区 · 扩图</div></div></div>
      <div class="doc-state"><span class="state-dot"></span><span>文档已打开</span></div>
    </header>
    <!-- 主工具区：作用目标从文档逐步细化到图层、选区和扩图块。 -->
    <div class="tool-scroll">
      <!-- 当前目标：所有动作执行前先核对文档和激活图层。 -->
      <section class="document-summary" aria-label="当前 Photoshop 文档"><div><div class="document-name">character-concept.psd</div><div class="document-meta">2048 × 2048 px · RGB/8</div></div><div class="layer-pill" title="当前激活图层">图层：角色修饰</div></section>
      <!-- 置入与导出：对应 placeImage、exportDocPng 和 exportActiveLayerPng。 -->
      <section class="section">
        <div class="section-head"><div class="section-title">置入与导出</div><div class="section-hint">非破坏性</div></div>
        <div class="section-body">
          <div class="segments" id="exportScope" aria-label="导出范围"><button class="seg active" type="button" data-scope="document">合并文档</button><button class="seg" type="button" data-scope="layer">激活图层</button></div>
          <div class="action-row"><button class="button" type="button" data-file-trigger="placeFile">置入智能对象</button><button class="button primary" type="button" data-action="export-current">导出 PNG</button></div>
          <input id="placeFile" class="file-input" type="file" accept="image/*">
          <div id="placeFileName" class="file-result">尚未选择置入文件</div>
        </div>
      </section>
      <!-- 选区工具：读取边界后才能启用精确贴回和选区导出。 -->
      <section class="section">
        <div class="section-head"><div class="section-title">当前选区</div><button class="button" type="button" data-action="read-selection">重新读取</button></div>
        <div class="section-body">
          <div class="bounds" aria-label="选区边界"><div class="bound"><span>X</span><strong>384</strong></div><div class="bound"><span>Y</span><strong>256</strong></div><div class="bound"><span>W</span><strong>1024</strong></div><div class="bound"><span>H</span><strong>768</strong></div></div>
          <div class="action-row"><button class="button" type="button" data-action="export-selection-jpg">导出合并选区</button><button class="button" type="button" data-action="export-selection-png">导出透明 PNG</button></div>
          <div class="action-row"><button class="button wide" type="button" data-file-trigger="selectionFile">按选区位置置入结果</button></div>
          <input id="selectionFile" class="file-input" type="file" accept="image/*">
          <div id="selectionFileName" class="file-result">结果会缩放并对齐到 X 384 / Y 256</div>
        </div>
      </section>
      <!-- 方向扩图：对应 outpaintDirections(dirs, pixels)。 -->
      <section class="section">
        <div class="section-head"><div class="section-title">方向扩图</div><div id="directionCount" class="section-hint">已选 1 个方向</div></div>
        <div class="section-body">
          <div class="outpaint-layout" aria-label="扩图方向">
            <button class="direction top" type="button" data-direction="top" aria-pressed="false" title="向上扩图">↑</button>
            <button class="direction left" type="button" data-direction="left" aria-pressed="false" title="向左扩图">←</button>
            <div class="canvas-preview" aria-label="扩图范围示意"><div class="expand-mark top" data-mark="top"></div><div class="expand-mark left" data-mark="left"></div><div class="canvas-image">当前文档</div><div class="expand-mark right active" data-mark="right"></div><div class="expand-mark bottom" data-mark="bottom"></div></div>
            <button class="direction right active" type="button" data-direction="right" aria-pressed="true" title="向右扩图">→</button>
            <button class="direction bottom" type="button" data-direction="bottom" aria-pressed="false" title="向下扩图">↓</button>
          </div>
          <div class="pixels-row"><label for="pixelsRange">扩展</label><input id="pixelsRange" type="range" min="64" max="1024" step="64" value="512"><input id="pixelsInput" type="number" min="64" max="4096" step="64" value="512" aria-label="扩展像素"></div>
          <div class="action-row"><button id="outpaintButton" class="button primary wide" type="button" data-action="outpaint">生成透明扩图块</button></div>
          <div id="blockResult" class="file-result">右侧块：1024 × 2048 px</div>
        </div>
      </section>
    </div>
    <!-- 底栏：集中显示当前操作状态，不让各分组高度来回跳动。 -->
    <footer class="status-bar" role="status" aria-live="polite"><span id="statusIcon" class="status-icon ok"></span><span id="statusText" class="status-text">Photoshop 文档已就绪</span></footer>
  </main>
  <script>
    /* 浏览器样例状态只保存导出范围和扩图方向。 */
    /* 真正 UXP 插件应实时读取 app.activeDocument，不应信任这里的演示文档信息。 */
    /* 文件输入仅用于验证交互和文件名布局，不会读写 Photoshop 文档。 */
    const state = { exportScope: 'document', directions: new Set(['right']), busyTimer: 0 };
    /* 固定节点集中索引，事件函数不重复查询同一元素。 */
    const elements = {
      exportScope: document.querySelector('#exportScope'),
      placeFile: document.querySelector('#placeFile'),
      placeFileName: document.querySelector('#placeFileName'),
      selectionFile: document.querySelector('#selectionFile'),
      selectionFileName: document.querySelector('#selectionFileName'),
      directionCount: document.querySelector('#directionCount'),
      pixelsRange: document.querySelector('#pixelsRange'),
      pixelsInput: document.querySelector('#pixelsInput'),
      outpaintButton: document.querySelector('#outpaintButton'),
      blockResult: document.querySelector('#blockResult'),
      statusIcon: document.querySelector('#statusIcon'),
      statusText: document.querySelector('#statusText'),
    };
    /* setStatus 是统一反馈入口，新操作会撤销旧计时，避免旧结果覆盖新状态。 */
    /* 真实 UXP 版本应由异步方法的 try/catch/finally 驱动，不使用演示计时器。 */
    function setStatus(text, kind = 'ok', settleText = '') {
      window.clearTimeout(state.busyTimer);
      elements.statusText.textContent = text;
      elements.statusText.title = text;
      elements.statusIcon.className = `status-icon ${kind}`;
      if (!settleText) return;
      state.busyTimer = window.setTimeout(() => setStatus(settleText, 'ok'), 650);
    }
    /* 导出范围映射到 ps.js 的 exportCurrentPng，由 exportLayer 状态选择实现。 */
    function selectExportScope(button) {
      state.exportScope = button.dataset.scope;
      elements.exportScope.querySelectorAll('[data-scope]').forEach((item) => item.classList.toggle('active', item === button));
      const label = state.exportScope === 'layer' ? '激活图层' : '合并文档';
      setStatus(`导出范围已切换为：${label}`);
    }
    /* 方向按钮、aria 状态与画布示意同步，至少选一个方向才能执行。 */
    function updateDirection(button) {
      const direction = button.dataset.direction;
      state.directions.has(direction) ? state.directions.delete(direction) : state.directions.add(direction);
      button.classList.toggle('active', state.directions.has(direction));
      button.setAttribute('aria-pressed', String(state.directions.has(direction)));
      document.querySelector(`[data-mark="${direction}"]`).classList.toggle('active', state.directions.has(direction));
      elements.directionCount.textContent = `已选 ${state.directions.size} 个方向`;
      elements.outpaintButton.disabled = state.directions.size === 0;
      updateBlockSummary();
    }
    /* 像素值限制在 64–4096，非法输入恢复默认 512。 */
    function normalizePixels(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return 512;
      return Math.min(4096, Math.max(64, parsed));
    }
    /* range 用于快速选择到 1024，数字框保留更大的专业输入。 */
    function updatePixels(value) {
      const pixels = normalizePixels(value);
      elements.pixelsInput.value = String(pixels);
      elements.pixelsRange.value = String(Math.min(1024, pixels));
      updateBlockSummary();
    }
    /* 按 ps.js 几何规则：左右块为 2N×文档高，上下块为文档宽×2N。 */
    function updateBlockSummary() {
      const pixels = normalizePixels(elements.pixelsInput.value);
      const horizontal = ['left', 'right'].some((item) => state.directions.has(item));
      const vertical = ['top', 'bottom'].some((item) => state.directions.has(item));
      const sizes = [];
      if (horizontal) sizes.push(`左右块 ${pixels * 2} × 2048`);
      if (vertical) sizes.push(`上下块 2048 × ${pixels * 2}`);
      elements.blockResult.textContent = sizes.length ? `${sizes.join('；')} px` : '请至少选择一个扩图方向';
    }
    /* 文件输入模拟 placeImage 或 placeImageAt，只展示名称，不读取图像内容。 */
    function handleFile(input, target, mode) {
      const file = input.files && input.files[0];
      if (!file) return;
      target.textContent = file.name;
      const action = mode === 'selection' ? '按选区位置置入结果' : '置入为智能对象';
      setStatus(`正在${action}：${file.name}`, 'busy', `已${action}：${file.name}`);
    }
    /* 操作表只包含 ps.js 已有能力，真实接入时替换为对应异步函数。 */
    function runAction(action) {
      const labels = {
        'export-current': state.exportScope === 'layer' ? '导出激活图层 PNG' : '导出合并文档 PNG',
        'read-selection': '读取当前矩形选区',
        'export-selection-jpg': '导出合并选区 JPEG',
        'export-selection-png': '导出透明选区 PNG',
        outpaint: `生成 ${state.directions.size} 个透明扩图块`,
      };
      const label = labels[action];
      if (label) setStatus(`正在${label}…`, 'busy', `${label}完成`);
    }
    /* 导出范围通过事件委托共用一套切换逻辑。 */
    elements.exportScope.addEventListener('click', (event) => {
      const button = event.target.closest('[data-scope]');
      if (button) selectExportScope(button);
    });
    /* 文件入口和普通动作由 data 属性统一路由。 */
    document.addEventListener('click', (event) => {
      const trigger = event.target.closest('[data-file-trigger]');
      if (trigger) document.querySelector(`#${trigger.dataset.fileTrigger}`).click();
      const action = event.target.closest('[data-action]');
      if (action) runAction(action.dataset.action);
    });
    /* 四个方向共享同一个参数化处理器。 */
    document.querySelectorAll('[data-direction]').forEach((button) => button.addEventListener('click', () => updateDirection(button)));
    /* 文件变化只更新文件名与操作反馈。 */
    elements.placeFile.addEventListener('change', () => handleFile(elements.placeFile, elements.placeFileName, 'place'));
    elements.selectionFile.addEventListener('change', () => handleFile(elements.selectionFile, elements.selectionFileName, 'selection'));
    /* 两个像素输入保持同步，change 时纠正越界值。 */
    elements.pixelsRange.addEventListener('input', () => updatePixels(elements.pixelsRange.value));
    elements.pixelsInput.addEventListener('input', updateBlockSummary);
    elements.pixelsInput.addEventListener('change', () => updatePixels(elements.pixelsInput.value));
    /* 首屏说明与默认向右扩图 512px 保持一致。 */
    updateBlockSummary();
  </script>
</body>
</html>
