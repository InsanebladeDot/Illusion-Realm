    .v-neon{background:#16172a;border-color:#62f2e0;color:#fff;border-radius:5px;box-shadow:0 0 0 1px #ff5bd6,0 0 12px rgba(98,242,224,.55);text-shadow:0 0 7px #62f2e0}

    .v-underwater{background:linear-gradient(180deg,#e9fbff,#cbeeff);border-color:#58a4bf;color:#246277;border-radius:35px;box-shadow:0 9px 20px rgba(56,143,175,.2)}

    .drawer-backdrop{background:rgba(20,22,32,.32);backdrop-filter:blur(2px)}
    /* 减少动态效果时取消卡片抬升和抽屉过渡。 */

    @media(prefers-reduced-motion:reduce){.template-card{transition:none}.template-card:hover{transform:none}}

    @media print{body{background:#fff}.sticky-bar,#drawer{display:none!important}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.template-card{break-inside:avoid;box-shadow:none}}
  
    /* 视图隐藏使用原生 hidden 属性，避免库和编辑器同时参与页面布局。 */

    /* 这里只切换两个页面级容器，不把卡片内容当作标签页永久挂起。 */

    /* 编辑页占满可用宽度，但把控制区限制为稳定宽度，画布获得主要空间。 */

    .editor-layout{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:18px;align-items:start}
    /* 参数面板使用单层分组，不在卡片内部继续嵌套装饰卡片。 */
    /* 桌面吸顶只减少长画布往返滚动，手机会恢复普通文档流。 */
    /* 分隔线表达参数组边界，不额外使用阴影争夺画布注意力。 */

    .control-group{padding:16px;border-bottom:1px solid rgba(25,28,43,.08)}
    .control-group:last-child{border-bottom:0}
    .control-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px;font-weight:700;color:rgba(25,28,43,.62)}

    /* 分段按钮共享等宽网格，让横竖切换不会挤动相邻控件。 */

    /* 固定最小高度让状态切换时控制区不发生跳动。 */

      {name:'粉色浪漫',category:'fantasy',style:'v-romance',tail:'tail-left',text:'其实，我一直想告诉你。',use:'告白、温柔独白和浪漫场景。',params:'variant="romance" side="left"',note:'颜色不用于推断角色性别。'},
      {name:'星光幻想',category:'fantasy',style:'v-starlight',tail:'tail-right',text:'星辰会回应你的愿望。',use:'魔法、夜空和幻想世界。',params:'variant="fantasy" texture="stars"',note:'星点保持静态和稀疏。'},
      {name:'魔法卷轴',category:'fantasy',style:'v-scroll',tail:'no-tail',text:'古老的门将在月圆时开启。',use:'咒文、预言和古代文本。',params:'variant="scroll" tail="none"',note:'长内容需要扩大旁白区域。'},
      {name:'幽灵回声',category:'fantasy',style:'v-ghost',tail:'tail-left',text:'你还能听见我吗……',use:'灵体、回声和记忆声音。',params:'variant="ghost" opacity="soft"',note:'透明效果不能牺牲文字对比。'},
      {name:'反派低语',category:'fantasy',style:'v-villain',tail:'tail-right',text:'一切都在计划之中。',use:'戏剧性反派和暗色场景。',params:'variant="villain" side="right"',note:'角色身份仍需由剧情和名称确认。'},
      {name:'精灵指引',category:'fantasy',style:'v-fairy',tail:'tail-left',text:'跟着叶片的光走。',use:'森林、精灵和治愈指引。',params:'variant="fairy" scheme="nature"',note:'绿色不代表系统成功状态。'},
      {name:'水下声音',category:'fantasy',style:'v-underwater',tail:'tail-right',text:'声音从水面上方传来。',use:'水下、隔窗和朦胧交流。',params:'variant="underwater" side="right"',note:'内部不叠加干扰文字的气泡纹理。'},
      {name:'透明玻璃',category:'fantasy',style:'v-glass',tail:'tail-left',text:'看清了吗？这就是答案。',use:'现代叠层、玻璃界面和梦境。',params:'variant="glass" blur="medium"',note:'复杂底图上必须检查实际对比。'},
      {name:'网点漫画',category:'manga',style:'v-halftone',tail:'tail-right',text:'真相只有一个！',use:'黑白漫画和经典强调对白。',params:'variant="halftone" density="medium"',note:'打印缩放时需检查摩尔纹。'},
      {name:'墨刷对白',category:'manga',style:'v-ink',tail:'tail-left',text:'此战，我不会退。',use:'武侠、决断和章节题句。',params:'variant="ink" weight="heavy"',note:'保留真实文本，不把文字做进图片。'},
      {name:'竖排日漫',category:'manga',style:'v-vertical',tail:'tail-right',text:'请相信我。',use:'传统漫画中的短句竖排。',params:'variant="vertical" direction="rl"',note:'长句必须回退横排。'},
      {name:'贴纸对白',category:'manga',style:'v-sticker',tail:'no-tail',text:'今天也要加油！',use:'轻松、可爱和综艺式标注。',params:'variant="sticker" accent="pink"',note:'低频使用才能保留俏皮效果。'},
      {name:'喜剧吐槽',category:'manga',style:'v-comedy',tail:'tail-left',text:'这完全不合理吧！',use:'吐槽、反差和喜剧停顿。',params:'variant="comedy" timing="punch"',note:'控制在两行以内。'},
      {name:'害羞小声',category:'manga',style:'v-shy',tail:'tail-right',text:'那个……谢谢。',use:'害羞、迟疑和小声回应。',params:'variant="mini" tone="shy"',note:'超过两行时改用柔和对白。'},
      {name:'无言省略',category:'manga',style:'v-silent',tail:'tail-left',text:'……',use:'沉默、停顿和无言反应。',params:'variant="silent" ariaLabel="沉默"',note:'不是空数据，辅助文本必须说明语义。'},
      {name:'破框宣言',category:'manga',style:'v-breakout',tail:'no-tail',text:'故事才刚刚开始。',use:'结尾宣言、跨格对白和打破常规。',params:'variant="breakout" emphasis="final"',note:'应低频使用，避免破坏页面秩序。'}
    ];
    /* 页面状态把素材库条件与编辑参数分开，视图切换不会污染筛选结果。 */
    /* selectedIndex 始终指向原数组索引，筛选后选择仍能对应正确模板。 */
    /* lastTrigger 用于关闭抽屉时把键盘焦点送回原卡片。 */
    /* 编辑参数只属于当前页面内存，刷新页面会按样例默认值重新开始。 */
    const state={category:'all',query:'',lastTrigger:null,selectedIndex:0,canvas:'landscape',direction:'horizontal',align:'center',fontSize:14,lineHeight:1.45,letterSpacing:0};
    /* 固定节点只查询一次；本页没有框架卸载过程，所以无需订阅清理。 */
    /* 节点表像工具箱索引，后续函数从同一位置取控件，避免选择器写散。 */
    /* 这个类比对应真实机制：集中缓存固定 DOM 引用，动态卡片仍走事件委托。 */
    const nodes={library:document.querySelector('#library-view'),editor:document.querySelector('#editor-view'),grid:document.querySelector('#grid'),empty:document.querySelector('#empty'),count:document.querySelector('#result-count'),drawer:document.querySelector('#drawer'),search:document.querySelector('#search'),dialogue:document.querySelector('#dialogue'),bubble:document.querySelector('#editor-bubble'),canvas:document.querySelector('#comic-canvas')};
    /* 编码保护配置文字进入 HTML 模板时的边界。 */
    /* 当前数据虽然写死，保留这层可避免未来外部文本把尖括号解析成标签。 */
    /* 用户编辑文字走 textContent，不经过本函数也不会执行为 HTML。 */
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    /* 分类中文只从 categories 读取，模板不用重复保存两份名称。 */
    /* 未知 id 回退自身，开发阶段仍能看见错误值而不是空标签。 */
    const categoryLabel=id=>categories.find(entry=>entry[0]===id)?.[1]??id;
    /* 同一气泡函数服务卡片和详情；编辑器会额外加入可编辑类。 */
    /* class 只来自受控配置，不接受搜索内容或用户文字。 */
    /* extra 只供详情预览放大，不改变模板的稳定 variant。 */
    const bubbleHtml=(item,extra='')=>`<div class="bubble ${item.style} ${item.tail} ${extra}">${escapeHtml(item.text)}</div>`;
    /* 卡片只注入配置差异，结构、编号和交互保持一份实现。 */
    /* data-template 保存原索引，过滤不会造成详情错位。 */
    /* 用途只展示一行摘要，完整边界留到详情抽屉阅读。 */
    /* article 保留独立语义，内部 button 提供完整键盘点击区域。 */
    function renderCard(item,index){const label=categoryLabel(item.category);return `<article class="template-card overflow-hidden rounded-lg border border-black/10 bg-white"><button class="group block w-full text-left" data-template="${index}" aria-label="查看 ${escapeHtml(item.name)} 的场景和参数"><div class="bubble-stage flex items-center justify-center bg-[#ece9e1] px-5">${bubbleHtml(item)}</div><div class="border-t border-black/8 p-4"><div class="flex items-center justify-between gap-3"><span class="text-[11px] font-bold tracking-wider text-accent">NO.${String(index+1).padStart(2,'0')}</span><span class="rounded bg-black/5 px-2 py-1 text-[10px] text-black/45">${escapeHtml(label)}</span></div><h2 class="mt-2 font-bold">${escapeHtml(item.name)}</h2><p class="mt-1 truncate text-xs text-black/45">${escapeHtml(item.use)}</p></div></button></article>`}
    /* 搜索覆盖名称、用途与六类中文名，分类和关键词可以组合使用。 */
    /* 结果从原数组即时推导，不维护容易过期的第二份列表。 */
    /* 48 条本地数据规模很小，直接过滤比引入索引和异步状态更清楚。 */
    /* map 先附原索引，就像给筛出的卡片保留原货架编号。 */
    /* 这个类比对应 selectedIndex 使用稳定原索引，不依赖结果位置。 */
    function getVisibleTemplates(){const query=state.query.trim().toLowerCase();return templates.map((item,index)=>({item,index})).filter(({item})=>{const searchable=`${item.name} ${item.use} ${categoryLabel(item.category)}`.toLowerCase();return(state.category==='all'||item.category===state.category)&&(!query||searchable.includes(query))})}
    /* renderLibrary 只更新结果区和统计，筛选栏自身由独立函数维护。 */
    /* 事件委托放在 grid 上，重新渲染卡片后不必逐个重新绑定。 */
    /* 空态与网格通过同一结果长度切换，不能出现相互矛盾的显示。 */
    function renderLibrary(){const visible=getVisibleTemplates();nodes.grid.innerHTML=visible.map(({item,index})=>renderCard(item,index)).join('');nodes.grid.classList.toggle('hidden',visible.length===0);nodes.empty.classList.toggle('hidden',visible.length!==0);nodes.count.textContent=`${visible.length} / ${templates.length}`}
    /* 筛选按钮由分类配置生成，新增分类只需改一处数据。 */
    /* aria-pressed 与颜色同时表达选中状态，不只依赖视觉。 */
    /* 所有未选按钮共享同一类串，不允许分类自行产生视觉分叉。 */
    function renderFilters(){const host=document.querySelector('#filters');host.innerHTML=categories.map(([id,label])=>{const active=id===state.category;return `<button data-filter="${id}" aria-pressed="${active}" class="shrink-0 rounded-md border px-3 py-2 text-xs font-semibold transition ${active?'border-ink bg-ink text-white':'border-black/10 bg-white text-black/55 hover:border-black/25'}">${label}</button>`}).join('')}
    /* 选择分类后保留关键词，用户可以继续缩小范围。 */
    /* renderFilters 先同步按钮，再刷新结果，辅助状态和内容不会错位。 */
    function selectFilter(id){state.category=id;renderFilters();renderLibrary()}
    /* 抽屉内容全部来自当前模板；打开后焦点进入关闭按钮。 */
    /* 详情只解释样式，真正编辑由“使用此模板”明确触发。 */
    /* 缺失索引直接返回，防止异常 data 值打开空面板。 */
    /* body 暂停滚动，抽屉自身负责短窗口中的纵向滚动。 */
    function openDrawer(index,trigger){const item=templates[index];if(!item)return;state.selectedIndex=index;state.lastTrigger=trigger;document.querySelector('#drawer-index').textContent=`TEMPLATE ${String(index+1).padStart(2,'0')} · ${categoryLabel(item.category)}`;document.querySelector('#drawer-title').textContent=item.name;document.querySelector('#drawer-preview').innerHTML=bubbleHtml(item,'scale-110');document.querySelector('#drawer-use').textContent=item.use;document.querySelector('#drawer-params').textContent=item.params;document.querySelector('#drawer-note').textContent=item.note;nodes.drawer.classList.remove('hidden');nodes.drawer.setAttribute('aria-hidden','false');document.body.classList.add('overflow-hidden');document.querySelector('#drawer-close').focus()}
    /* 关闭抽屉恢复页面滚动；需要时再把焦点送回触发卡片。 */
    /* skipFocus 用于直接进入编辑器，避免焦点先跳回被隐藏的图库。 */
    /* 重复关闭安全返回，Escape 连按不会打乱当前焦点。 */
    function closeDrawer(skipFocus=false){if(nodes.drawer.classList.contains('hidden'))return;nodes.drawer.classList.add('hidden');nodes.drawer.setAttribute('aria-hidden','true');document.body.classList.remove('overflow-hidden');if(!skipFocus)state.lastTrigger?.focus()}
    /* 分段按钮统一按 data 属性更新，三个控制组共用同一个状态规则。 */
    /* selector 决定读取哪个受控 data 字段，不接受页面外输入。 */
    /* 每组只允许一个值为 true，避免视觉上同时选中两个方向。 */
    function setPressed(selector,value){document.querySelectorAll(selector).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset[selector.includes('canvas')?'canvas':selector.includes('direction')?'direction':'align']===value)))}
    /* 把当前参数写到气泡行内样式，模板类继续负责外观。 */
    /* 行内只覆盖用户明确调整的排版属性，不改背景、边框与尾巴。 */
    /* 横竖类互斥切换，尤其可覆盖 v-vertical 模板的默认 writing-mode。 */
    /* 画布方向写进 data 属性，由 CSS 比例规则统一解释。 */
    function applyEditorStyles(){nodes.bubble.style.fontSize=`${state.fontSize}px`;nodes.bubble.style.lineHeight=String(state.lineHeight);nodes.bubble.style.letterSpacing=`${state.letterSpacing}px`;nodes.bubble.style.textAlign=state.align;nodes.bubble.classList.toggle('editor-text-vertical',state.direction==='vertical');nodes.bubble.classList.toggle('editor-text-horizontal',state.direction==='horizontal');nodes.canvas.dataset.orientation=state.canvas}
    /* 控件值与标签从 state 同步，重置或换模板时不会显示旧值。 */
    /* range 保存整数，行距显示时再除以 100，避免浮点步进异常。 */
    /* 所有分段组在这里一次刷新，按钮状态不会晚于画布。 */
    function syncControls(){document.querySelector('#font-size').value=String(state.fontSize);document.querySelector('#font-size-value').textContent=`${state.fontSize}px`;document.querySelector('#line-height').value=String(Math.round(state.lineHeight*100));document.querySelector('#line-height-value').textContent=state.lineHeight.toFixed(2);document.querySelector('#letter-spacing').value=String(state.letterSpacing);document.querySelector('#letter-spacing-value').textContent=`${state.letterSpacing}px`;setPressed('[data-canvas]',state.canvas);setPressed('[data-direction]',state.direction);setPressed('[data-align]',state.align)}
    /* 文字计数按 Unicode 字符展开，表情不会被错误算成两个 UTF-16 单元。 */
    /* 计数只做反馈，真正上限同时由 textarea 和气泡同步函数约束。 */
    function updateCharacterCount(){document.querySelector('#char-count').textContent=`${[...nodes.dialogue.value].length} 字`}
    /* 渲染编辑器时直接复用所选模板类，只重新建立一个可编辑气泡。 */
    /* v-vertical 默认选择竖排，其余模板默认横排，用户仍可手动切换。 */
    /* resetText=false 预留给只刷新样式的场景，不会覆盖正在编辑的文字。 */
    /* 类名整体重建可以清除上一个模板留下的 variant 和 tail。 */
    /* 渲染顺序先写状态与文字，再统一同步样式、控件和计数。 */
    function renderEditor(resetText=true){const item=templates[state.selectedIndex];if(!item)return;if(resetText){state.canvas='landscape';state.direction=item.style==='v-vertical'?'vertical':'horizontal';state.align='center';state.fontSize=14;state.lineHeight=1.45;state.letterSpacing=0;nodes.dialogue.value=item.text}nodes.bubble.className=`bubble editor-bubble ${item.style} ${item.tail}`;nodes.bubble.textContent=nodes.dialogue.value;document.querySelector('#editor-index').textContent=`TEMPLATE ${String(state.selectedIndex+1).padStart(2,'0')} · ${categoryLabel(item.category)}`;document.querySelector('#editor-title').textContent=item.name;applyEditorStyles();syncControls();updateCharacterCount()}
    /* 进入编辑视图前关闭抽屉并滚到页首，避免保留遮罩或旧滚动位置。 */
    /* 焦点落到返回按钮，键盘用户能立即撤回本次选择。 */
    /* 先完成编辑器渲染再显示，用户不会看到默认气泡闪一下。 */
    function enterEditor(){closeDrawer(true);renderEditor(true);nodes.library.hidden=true;nodes.editor.hidden=false;window.scrollTo({top:0,behavior:'auto'});document.querySelector('#back-to-library').focus()}
    /* 返回时保留搜索和分类；重新渲染保证结果统计仍与状态一致。 */
    /* 搜索框获得焦点，用户可直接继续输入或清除关键词。 */
    /* 当前编辑文字只留在内存，不冒充已保存的项目草稿。 */
    function showLibrary(){nodes.editor.hidden=true;nodes.library.hidden=false;renderFilters();renderLibrary();window.scrollTo({top:0,behavior:'auto'});nodes.search.focus()}
    /* 输入框编辑使用 textContent 写入气泡，用户文字不会被当成 HTML。 */
    /* 输入框自带 maxlength，因此这里无需再次截断正常路径。 */
    function syncTextFromInput(){nodes.bubble.textContent=nodes.dialogue.value;updateCharacterCount()}
    /* 气泡直接编辑时反向写回输入框，并限制到 textarea 相同的 120 字。 */
    /* 正常输入不重写气泡 DOM，避免浏览器把正在输入的光标送回开头。 */
    /* 只有越界时才回写截断值，保证内容和字符计数重新一致。 */
    function syncTextFromBubble(){const characters=[...nodes.bubble.innerText];const value=characters.slice(0,120).join('');if(characters.length>120)nodes.bubble.textContent=value;nodes.dialogue.value=value;updateCharacterCount()}
    /* 范围控件共用读取规则，减少三个相同监听器的重复实现。 */
    /* id 来自本文件固定数组，不允许任意选择器或状态字段注入。 */
    /* 更新后同时刷新画布和数值标签，拖动反馈保持同步。 */
    function updateRange(id){const value=Number(document.querySelector(`#${id}`).value);if(id==='font-size')state.fontSize=value;if(id==='line-height')state.lineHeight=value/100;if(id==='letter-spacing')state.letterSpacing=value;applyEditorStyles();syncControls()}
    /* 网格和分类采用事件委托，动态生成节点仍能响应点击。 */
    /* closest 允许点击卡片内部文字或气泡时仍找到所属按钮。 */
    /* 未命中受控 data 属性时不执行任何业务。 */
    nodes.grid.addEventListener('click',event=>{const button=event.target.closest('[data-template]');if(button)openDrawer(Number(button.dataset.template),button)});
    document.querySelector('#filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(button)selectFilter(button.dataset.filter)});
    /* 搜索是 48 条本地数据，即时过滤不需要防抖或异步等待。 */
    /* 输入原值保存在 state，真正匹配前才 trim 和转小写。 */
    nodes.search.addEventListener('input',event=>{state.query=event.target.value;renderLibrary()});
    /* 三种关闭方式共用 closeDrawer，Escape 在抽屉隐藏时没有副作用。 */
    /* 面板不是遮罩按钮的子节点，点击面板内容不会误关闭。 */
    /* Escape 只调用幂等关闭函数，不影响编辑器视图。 */
    document.querySelector('#drawer-close').addEventListener('click',()=>closeDrawer());
    document.querySelector('.drawer-backdrop').addEventListener('click',()=>closeDrawer());
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
    /* 使用、返回和更换模板组成清楚的两级流程。 */
    /* 两个返回入口行为完全相同，所以共享 showLibrary。 */
    document.querySelector('#use-template').addEventListener('click',enterEditor);
    document.querySelector('#back-to-library').addEventListener('click',showLibrary);
    document.querySelector('#change-template').addEventListener('click',showLibrary);
    /* 输入框与气泡都可以作为文字入口，两者共享同一字符上限。 */
    /* 两条监听链只同步文字，不重新渲染整个编辑器。 */
    nodes.dialogue.addEventListener('input',syncTextFromInput);
    nodes.bubble.addEventListener('input',syncTextFromBubble);
    /* 分段控件只注入选项值，画布、方向和对齐行为各自保持简单。 */
    /* 每次点击都先改 state，再由共用函数刷新样式与 pressed 状态。 */
    /* 三组业务含义不同，只复用完全相同的状态同步机制。 */
    document.querySelectorAll('[data-canvas]').forEach(button=>button.addEventListener('click',()=>{state.canvas=button.dataset.canvas;applyEditorStyles();syncControls()}));
    document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{state.direction=button.dataset.direction;applyEditorStyles();syncControls()}));
    document.querySelectorAll('[data-align]').forEach(button=>button.addEventListener('click',()=>{state.align=button.dataset.align;applyEditorStyles();syncControls()}));
    /* 三个范围输入通过 id 进入同一更新函数。 */
    /* input 事件提供连续预览，用户无需松开滑块才看到结果。 */
    ['font-size','line-height','letter-spacing'].forEach(id=>document.querySelector(`#${id}`).addEventListener('input',()=>updateRange(id)));
    /* 重置只恢复当前模板默认值，不切换模板或修改图库筛选。 */
    /* 默认示例来自 templates 配置，不保存第三份默认文字。 */
    document.querySelector('#reset-editor').addEventListener('click',()=>renderEditor(true));
    /* 初始只显示完整素材库；编辑器等用户选择后再初始化。 */
    /* 初始化先创建筛选按钮，再创建卡片结果，首帧状态一致。 */
    renderFilters();renderLibrary();
  </script>
</body>
</html>
