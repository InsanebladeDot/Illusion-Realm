appId: com.illusionrealm.app
productName: Illusion Realm
beforePack: scripts/ffmpeg-before-pack.cjs
afterPack: scripts/ffmpeg-after-pack.cjs

# electron-builder 输出目录（相对于 apps/electron）：apps/electron/release
directories:
  output: release

# 运行源码统一置于 src，递归白名单随功能目录扩展，不再手工枚举每个域。
# assets 只分发窗口实际使用的 PNG；ICO 仅在 Windows 打包时使用。
# installer 是独立安装向导，scripts 是构建工具，均不混入客户端 asar。
# scripts/verify-electron-modules.js 从 main 与 preload 出发核对依赖图覆盖。
# 注意：Next.js 静态导出目录位于 app 目录之外（apps/next/out），
#       electron-builder 不会把外部目录收进 asar，因此通过 extraResources 分发。
files:
  - '!**/*'
  - 'src/**/*'
  - 'assets/icon.png'
  - 'package.json'
  - 'node_modules/@illusion-realm/**/*'

asar: true
# 原生模块解包（当前无 .node，但保留约定）
asarUnpack:
  - '**/*.node'

extraResources:
  # 单一角色资料源供 Agent 与创建页共用；安装后不依赖开发机路径。
  # JSON 保留原始字段，不执行 TS 或浏览器全局脚本。
  - from: ../../packages/shared/src/data/character-reference.json
    to: character-reference.json
  # 自有许可与安装说明随客户端保留，卸载前也可以脱离向导查阅。
  # 第三方组件许可仍各自保留；这两个文件不替代 FFmpeg 等原有通知。
  # 使用 extraResources 放在可直接阅读的位置，不把许可仅藏于安装器。
  - from: ../../LICENSE
    to: LICENSE-Illusion-Realm.txt
  - from: installer/NOTICE.txt
    to: INSTALLATION-NOTICE.txt
  # Next.js 静态导出（生产环境由 app:// 协议读取：resources/next-out）
  - from: ../next/out
    to: next-out
    filter:
      - '**/*'
  # Agent（Python sidecar）：**方案 A = 随包带虚拟环境**（2026-09-27 定）。
  # 目标目录必须是 agent：`src/main/modules/agent/locate.js` 把 AGENT_DIR 算成 <resources>/agent，
  # 解释器查找的第一顺位就是它下面的 .venv/Scripts/python.exe。
  # **改名 / 漏收的后果不是报错而是静默降级**：locate.js 会一路回退到系统 PATH 的
  # python，打包版看起来"能跑"，实则用的是用户机器上的解释器（多半没装 mcp）。
  # 已知代价：venv 不可搬迁（pyvenv.cfg 的 home 指向基础 Python），
  # 所以目标机要么有同版本 Python 3.13，要么改走方案 B / embeddable。
  # filters 里剔掉的是运行期用不到的约 24MB：pip、pywin32 文档与 COM 家族、
  # win32 的示例/头文件/脚本 —— **但 pywin32 本身不能删**：
  # mcp/os/win32/utilities.py 在 Windows 上直接 import pywintypes / win32api /
  # win32con / win32job，删掉就是打包版一跑就 ModuleNotFoundError: pywintypes
  # （2026-09-27 实测踩过）。
  - from: ../agent
    to: agent
    filter:
      - 'agent_core/**'
      - 'tools/**'
      - 'pyproject.toml'
      - '.venv/**'
      - '!.venv/Lib/site-packages/pip/**'
      - '!.venv/Lib/site-packages/pip-*.dist-info/**'
      - '!.venv/Lib/site-packages/PyWin32.chm'
      - '!.venv/Lib/site-packages/win32com/**'
      - '!.venv/Lib/site-packages/win32comext/**'
      - '!.venv/Lib/site-packages/pythonwin/**'
      - '!.venv/Lib/site-packages/isapi/**'
      - '!.venv/Lib/site-packages/adodbapi/**'
      - '!.venv/Lib/site-packages/win32/Demos/**'
      - '!.venv/Lib/site-packages/win32/include/**'
      - '!.venv/Lib/site-packages/win32/libs/**'
      - '!.venv/Lib/site-packages/win32/scripts/**'
      - '!.venv/Lib/site-packages/win32/test/**'
  # 方案 B（PyInstaller 单文件，≈40–60MB，需先在 apps/agent 里构建）留档：
  #   - from: ../agent/dist/iris-agent.exe
  #     to: agent/iris-agent.exe
  # 选 B 前先读 docs/agent-integration.md：工具 server 是**第二个** Python 进程
  # （core.py 里 `sys.executable -m tools.server`），单文件 exe 不能直接 `-m`，
  # 得先给入口加一个 `--tools-server` 自调用分支。
  # FFmpeg / FFprobe：放到 apps/electron/bin/ffmpeg/ 后随包分发，
  # 运行期由 src/main/modules/ffmpeg/locate.js 通过 process.resourcesPath/ffmpeg 找到
  - from: bin/ffmpeg
    to: ffmpeg
    filter:
      - 'ffmpeg.exe'
      - 'ffprobe.exe'
      - 'LICENSE.txt'
      - 'UPSTREAM-README.txt'
      - 'SOURCE.txt'
      - 'bundle.json'

# 主进程与 preload 是手写 CommonJS，无需 node-gyp / npm 重建
npmRebuild: false
nodeGypRebuild: false

# 使用本地已安装的 Electron 发行包（pnpm 隔离布局下路径为 apps/electron/node_modules/electron/dist），
# 避免打包时再去 GitHub 下载 electron-v*.zip
electronDist: node_modules/electron/dist

win:
  # beforePack 直接将 256px PNG 封装为 ICO，避免打包时依赖 WASM 图标转换器。
  icon: assets/icon.ico
  target:
    - nsis
mac:
  icon: assets/icon.png
linux:
  icon: assets/icon.png

# 此 NSIS 是蓝白安装向导内嵌的安装引擎，不作为最终分发入口。
# 固定当前用户安装，避免向导承诺的范围与系统注册范围不一致。
# 安装目录通过经过校验的 /D 参数传入；NSIS 仍负责卸载与注册。
# 禁止安装后自行运行，启动只能由向导完成页的用户选择触发。
# 禁止自动发布，最终单文件由 scripts/build-installer.cjs 另行组装。
# 开始菜单的可选行为由 include 读取自定义开关，不删除其他应用快捷方式。
# blockmap 仅用于自动更新，本安装入口暂未接入自动更新服务。
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  differentialPackage: false
  include: installer/engine.nsh
  artifactName: illusion-realm-engine-${version}.exe
