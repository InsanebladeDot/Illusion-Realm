packages:
  - 'apps/*'
  - 'packages/*'
patchedDependencies:
  # Next 16.2.10 开发热更新可能重复清理旧样式，重新安装依赖也必须保留修复。
  next@16.2.10: patches/next@16.2.10.patch
allowBuilds:
  # 必须是 true：electron 的 postinstall 负责下载 electron.exe（~100MB）。
  # 留成 "set this to true or false" 会让 `pnpm install` 以 ERR_PNPM_IGNORED_BUILDS 退出 1；
  # 改成 false 则 install 通过、但没有二进制，`pnpm dev` 静默不弹窗。
  electron: true
  electron-winstaller: true
  exifreader: true
  sharp: true
  unrs-resolver: true
